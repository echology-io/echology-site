<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- White background -->
  <rect width="400" height="400" fill="#ffffff"/>

  <!-- Prism mark, smaller, centered higher -->
  <g transform="translate(200, 158) scale(1.4)">

    <!-- Outer hexagon -->
    <polygon points="0,-62 52,-34 52,34 0,62 -52,34 -52,-34"
      stroke="#c8a84e" stroke-width="2" fill="none"/>

    <!-- Crown facet -->
    <polygon points="0,-62 52,-34 28,-10 -18,-22"
      fill="#c8a84e" opacity="0.30"/>

    <!-- Right pavilion -->
    <polygon points="52,-34 52,34 28,-10"
      fill="#c8a84e" opacity="0.20"/>

    <!-- Left pavilion -->
    <polygon points="0,-62 -52,-34 -18,-22"
      fill="#c8a84e" opacity="0.22"/>

    <!-- Bottom pavilion -->
    <polygon points="-52,34 0,62 52,34 28,10 -18,22"
      fill="#c8a84e" opacity="0.12"/>

    <!-- Inner hex ring -->
    <polygon points="0,-24 26,-10 26,22 0,36 -26,22 -26,-10"
      stroke="#c8a84e" stroke-width="1.5" opacity="0.45" fill="none"/>

    <!-- Three-axis lines -->
    <line x1="0" y1="-62" x2="0" y2="62"
      stroke="#c8a84e" stroke-width="1" opacity="0.20"/>
    <line x1="-52" y1="-34" x2="52" y2="34"
      stroke="#c8a84e" stroke-width="1" opacity="0.18"/>
    <line x1="52" y1="-34" x2="-52" y2="34"
      stroke="#c8a84e" stroke-width="1" opacity="0.18"/>

    <!-- Center point -->
    <circle cx="0" cy="0" r="5" fill="#c8a84e" opacity="0.90"/>

    <!-- Fire vertices -->
    <circle cx="0"   cy="-62" r="3"   fill="#c8a84e" opacity="0.85"/>
    <circle cx="52"  cy="-34" r="2.5" fill="#c8a84e" opacity="0.70"/>
    <circle cx="52"  cy="34"  r="2"   fill="#c8a84e" opacity="0.55"/>
    <circle cx="0"   cy="62"  r="2"   fill="#c8a84e" opacity="0.45"/>
    <circle cx="-52" cy="34"  r="2"   fill="#c8a84e" opacity="0.50"/>
    <circle cx="-52" cy="-34" r="2.5" fill="#c8a84e" opacity="0.65"/>

  </g>

  <!-- ECHOLOGY wordmark — the primary element -->
  <text
    x="200" y="290"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="34"
    font-weight="300"
    letter-spacing="10"
    fill="#c8a84e"
  >ECHOLOGY</text>

  <!-- Subhead -->
  <text
    x="200" y="318"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="9"
    font-weight="300"
    letter-spacing="3.5"
    fill="#999999"
  >PERCEPTION BEFORE GENERATION</text>

</svg>
